name: CI and releases
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  checks:
    name: Linux checks
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          cache-on-failure: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libkrb5-dev libclang-dev libssl-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy -p kerberos-cache --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path vendor/psrp-rs/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --manifest-path vendor/psrp-rs/Cargo.toml --lib --test end_to_end
      - run: cargo test --lib generated_helpers_parse_in_powershell -- --ignored
      - run: cargo test --test local_powershell -- --ignored
      - run: cargo check --no-default-features --locked

  build:
    name: Build ${{ matrix.target }} on Linux
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu]
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Check tag version before building
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          tag = os.environ['RELEASE_TAG']
          if tag and tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match Cargo version {version}')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libkrb5-dev libclang-dev libssl-dev pkg-config
      - name: Install Windows cross compiler and static OpenSSL
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: bash .github/scripts/setup-windows-cross.sh
      - name: Normalize source paths
        run: |
          flags="--remap-path-prefix=$HOME=/build"
          if [ '${{ matrix.target }}' = 'x86_64-pc-windows-gnu' ]; then
            flags="$flags -C target-feature=+crt-static"
          fi
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true
      - name: Build all features
        run: cargo build --release --locked --all-features --target '${{ matrix.target }}'
      - name: Check Linux executable
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          target/x86_64-unknown-linux-gnu/release/evil-winrm-rs --version
          target/x86_64-unknown-linux-gnu/release/evil-winrm-rs --help
      - name: Check Windows runtime dependencies
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          imports=$(x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/evil-winrm-rs.exe | sed -n 's/.*DLL Name: //p')
          printf '%s\n' "$imports"
          if printf '%s\n' "$imports" | grep -Eiq 'lib(ssl|crypto|gcc|stdc\+\+|winpthread).*\.dll'; then
            echo 'Unexpected non-system runtime DLL dependency' >&2
            exit 1
          fi
      - name: Package executable and license notices
        run: |
          binary='target/${{ matrix.target }}/release/evil-winrm-rs'
          if [ '${{ matrix.target }}' = 'x86_64-pc-windows-gnu' ]; then binary="$binary.exe"; fi
          python3 .github/scripts/package-release.py --source . --binary "$binary" --target '${{ matrix.target }}' --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Publish both archives and checksums
        working-directory: artifacts
        run: |
          sha256sum evil-winrm-rs-*.tar.gz evil-winrm-rs-*.zip > SHA256SUMS
          gh release create "$RELEASE_TAG" ./* --verify-tag --title "evil-winrm-rs $RELEASE_TAG" --generate-notes
